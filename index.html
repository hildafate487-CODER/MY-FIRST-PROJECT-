<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Budget Tracker</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <header>
        <h1>💰 Student Budget Tracker</h1>
        <p>Manage your money. Track your spending. Reach your goals.</p>
    </header>

    <section class="balance-card">
        <h2>Current Balance</h2>
        <h3 id="balance">UGX 0</h3>
    </section>

    <section class="summary">

        <div class="summary-card">
            <h3>Income</h3>
            <p id="income">UGX 0</p>
        </div>

        <div class="summary-card">
            <h3>Expenses</h3>
            <p id="expenses">UGX 0</p>
        </div>

        <div class="summary-card">
            <h3>Total Spending</h3>
            <p id="totalSpending">UGX 0</p>
        </div>

    </section>

    <section class="form-section">

        <h2>➕ Add Transaction</h2>

        <label>Description</label>

        <input
            type="text"
            id="description"
            placeholder="e.g. Lunch"
        >

        <label>Amount</label>

        <input
            type="number"
            id="amount"
            placeholder="Enter amount in UGX"
        >

        <label>Date</label>

        <input
            type="date"
            id="date"
        >

        <label>Transaction Type</label>

        <select id="type">

            <option value="income">
                Income
            </option>

            <option value="expense">
                Expense
            </option>

        </select>

        <label>Category</label>

        <select id="category">

            <option value="Food">
                🍔 Food
            </option>

            <option value="Transport">
                🚌 Transport
            </option>

            <option value="School">
                📚 School
            </option>

            <option value="Airtime/Data">
                📱 Airtime/Data
            </option>

            <option value="Rent">
                🏠 Rent
            </option>

            <option value="Utilities">
                💡 Utilities
            </option>

            <option value="Shopping">
                🛍️ Shopping
            </option>

            <option value="Other">
                📦 Other
            </option>

        </select>

        <button onclick="addTransaction()">
            ➕ Add Transaction
        </button>

    </section>

    <section class="transactions">

        <h2>📋 Transactions</h2>

        <ul id="transactionList"></ul>

    </section>

    <section class="chart-section">

        <h2>📊 Spending by Category</h2>

        <canvas id="spendingChart"></canvas>

    </section>

</div>


<script>


/* LOAD SAVED TRANSACTIONS */

let transactions =
    JSON.parse(
        localStorage.getItem("budgetTransactions")
    ) || [];



/* ADD TRANSACTION */

function addTransaction() {

    const description =
        document
        .getElementById("description")
        .value
        .trim();


    const amount =
        Number(
            document
            .getElementById("amount")
            .value
        );


    const date =
        document
        .getElementById("date")
        .value;


    const type =
        document
        .getElementById("type")
        .value;


    const category =
        document
        .getElementById("category")
        .value;



    if (description === "") {

        alert("Please enter a description.");

        return;

    }


    if (amount <= 0) {

        alert("Please enter a valid amount.");

        return;

    }


    if (date === "") {

        alert("Please select a date.");

        return;

    }



    transactions.push({

        description: description,

        amount: amount,

        date: date,

        type: type,

        category: category

    });



    saveTransactions();



    document
    .getElementById("description")
    .value = "";


    document
    .getElementById("amount")
    .value = "";


    document
    .getElementById("date")
    .value = "";



    updateTracker();

}



/* SAVE TRANSACTIONS */

function saveTransactions() {

    localStorage.setItem(

        "budgetTransactions",

        JSON.stringify(transactions)

    );

}



/* UPDATE TRACKER */

function updateTracker() {

    let income = 0;

    let expenses = 0;



    const categoryTotals = {

        "Food": 0,

        "Transport": 0,

        "School": 0,

        "Airtime/Data": 0,

        "Rent": 0,

        "Utilities": 0,

        "Shopping": 0,

        "Other": 0

    };



    const transactionList =
        document
        .getElementById("transactionList");



    transactionList.innerHTML = "";



    transactions.forEach(

        function(transaction, index) {



            if (transaction.type === "income") {

                income += transaction.amount;

            }



            if (transaction.type === "expense") {

                expenses += transaction.amount;



                if (
                    categoryTotals
                    .hasOwnProperty(transaction.category)
                ) {

                    categoryTotals[
                        transaction.category
                    ] += transaction.amount;

                }

            }



            const li =
                document.createElement("li");



            li.textContent =

                transaction.description +

                " — UGX " +

                transaction.amount
                .toLocaleString() +

                " — " +

                transaction.category +

                " — " +

                transaction.date;



            const deleteButton =
                document.createElement("button");



            deleteButton.textContent =
                "🗑️ Delete";



            deleteButton.onclick =
                function() {

                    transactions.splice(index, 1);

                    saveTransactions();

                    updateTracker();

                };



            li.appendChild(deleteButton);

            transactionList.appendChild(li);

        }

    );



    const balance =
        income - expenses;



    document
    .getElementById("income")
    .textContent =
        "UGX " +
        income.toLocaleString();



    document
    .getElementById("expenses")
    .textContent =
        "UGX " +
        expenses.toLocaleString();



    document
    .getElementById("totalSpending")
    .textContent =
        "UGX " +
        expenses.toLocaleString();



    document
    .getElementById("balance")
    .textContent =
        "UGX " +
        balance.toLocaleString();



    updateChart(categoryTotals);

}



/* CHART */

let spendingChart;



function updateChart(categoryTotals) {

    const canvas =
        document
        .getElementById("spendingChart");



    if (spendingChart) {

        spendingChart.destroy();

    }



    spendingChart =

        new Chart(

            canvas,

            {

                type: "doughnut",


                data: {

                    labels:
                        Object.keys(
                            categoryTotals
                        ),


                    datasets: [{

                        label:
                            "Spending by Category",


                        data:
                            Object.values(
                                categoryTotals
                            )

                    }]

                },


                options: {

                    responsive: true,


                    plugins: {

                        legend: {

                            position: "bottom"

                        }

                    }

                }

            }

        );

}



/* START APP */

updateTracker();


</script>

</body>
</html>
