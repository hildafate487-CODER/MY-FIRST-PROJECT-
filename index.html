0<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>💰 Student Budget Tracker</h1>
            <p>Manage your money. Track your spending. Reach your goals.</p>
        </header>

        <section class="balance-card">
            <h2>Current Balance</h2>
            <h3 id="balance">UGX 0</h3>
        </section>

        <section class="summary">
            <div class="summary-card">
                <h3>Income</h3>
                <p id="income">UGX 0</p>
            </div>

            <div class="summary-card">
                <h3>Expenses</h3>
                <p id="expenses">UGX 0</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Add Transaction</h2>

            <input
                type="text"
                id="description"
                placeholder="Description (e.g. Food)"
            >

            <input
                type="number"
                id="amount"
                placeholder="Amount in UGX"
     >

            <input
               type="date"
               id="date"
     >
                
                
                
            

            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <select id="category">
    <option value="Food">🍔 Food</option>
    <option value="Transport">🚌 Transport</option>
    <option value="School">📚 School</option>
    <option value="Airtime & Data">📱 Airtime & Data</option>
    <option value="Rent">🏠 Rent</option>
    <option value="Utilities">💡 Utilities</option>
    <option value="Shopping">🛍️ Shopping</option>
    <option value="Other">📦 Other</option>
</select>

            <button id="addTransaction">Add Transaction</button>
        </section>
      <section class="chart-section">
    <h2>📊 Spending Overview</h2>
    <canvas id="spendingChart"></canvas>
</section>
      <div id="totalSpending" style="font-size: 20px; font-weight: bold; margin-top: 15px;">
  Total Spending: UGX 0
</div>
        <section class="transactions-section">
            <h2>Transactions</h2>

            <ul id="transactionList">
                <li class="empty-message">No transactions yet.</li>
            </ul>
        </section>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
    

</body>
</html>
