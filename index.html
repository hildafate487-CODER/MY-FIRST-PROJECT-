<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Budget Tracker</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>💰 Student Budget Tracker</h1>
            <p>Manage your money. Track your spending. Reach your goals.</p>
        </header>

        <!-- BALANCE -->
        <section class="balance-card">
            <h2>Current Balance</h2>
            <h3 id="balance">UGX 0</h3>
        </section>

        <!-- SUMMARY -->
        <section class="summary">

            <div class="summary-card">
                <h3>Income</h3>
                <p id="income">UGX 0</p>
            </div>

            <div class="summary-card">
                <h3>Expenses</h3>
                <p id="expenses">UGX 0</p>
            </div>

            <div class="summary-card">
                <h3>Total Spending</h3>
                <p id="totalSpending">UGX 0</p>
            </div>

        </section>

        <!-- ADD TRANSACTION -->
        <section class="form-section">

            <h2>Add Transaction</h2>

            <input
                type="text"
                id="description"
                placeholder="Description"
            >

            <input
                type="number"
                id="amount"
                placeholder="Amount in UGX"
            >

            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>

            <select id="category">
    <option value="Food">🍔 Food</option>
    <option value="Transport">🚌 Transport</option>
    <option value="School">📚 School</option>
    <option value="Airtime/Data">📱 Airtime/Data</option>
    <option value="Rent">🏠 Rent</option>
    <option value="Utilities">💡 Utilities</option>
    <option value="Shopping">🛍️ Shopping</option>
    <option value="Other">📦 Other</option>
</select>
               
                
           

            <button onclick="addTransaction()">
                ➕ Add Transaction
            </button>

        </section>

        <!-- TRANSACTIONS -->
        <section class="transactions">

            <h2>Transactions</h2>

            <ul id="transactionList"></ul>

        </section>

        <!-- CHART -->
        <section class="chart-section">

            <h2>📊 Spending Chart</h2>

            <canvas id="spendingChart"></canvas>

        </section>

    </div>

    <script>

        let transactions = [];

        function addTransaction() {

            const description =
                document.getElementById("description").value;

            const amount =
                Number(document.getElementById("amount").value);

            const type =
                document.getElementById("type").value;

            const category =
                document.getElementById("category").value;

            if (description === "" || amount <= 0) {
                alert("Please enter a description and a valid amount.");
                return;
            }

            transactions.push({
                description: description,
                amount: amount,
                type: type,
                category: category
            });

            document.getElementById("description").value = "";
            document.getElementById("amount").value = "";

            updateTracker();
        }


        function updateTracker() {

            let income = 0;
            let expenses = 0;
            let food = 0;
            let transport = 0;

            const transactionList =
                document.getElementById("transactionList");

            transactionList.innerHTML = "";

            transactions.forEach(function(transaction) {

                if (transaction.type === "income") {

                    income += transaction.amount;

                } else {

                    expenses += transaction.amount;

                    if (transaction.category === "Food") {
                        food += transaction.amount;
                    }

                    if (transaction.category === "Transport") {
                        transport += transaction.amount;
                    }
                }

                const li = document.createElement("li");

                li.textContent =
                    transaction.description +
                    " - UGX " +
                    transaction.amount +
                    " (" +
                    transaction.category +
                    ")";

                transactionList.appendChild(li);
            });


            const balance = income - expenses;


            document.getElementById("income").textContent =
                "UGX " + income.toLocaleString();

            document.getElementById("expenses").textContent =
                "UGX " + expenses.toLocaleString();

            document.getElementById("totalSpending").textContent =
                "UGX " + expenses.toLocaleString();

            document.getElementById("balance").textContent =
                "UGX " + balance.toLocaleString();


            updateChart(food, transport);
        }


        let spendingChart;


        function updateChart(food, transport) {

            const ctx =
                document.getElementById("spendingChart");

            if (spendingChart) {
                spendingChart.destroy();
            }

            spendingChart = new Chart(ctx, {

                type: "doughnut",

                data: {

                    labels: [
                        "Food",
                        "Transport"
                    ],

                    datasets: [{
                        label: "Spending",
                        data: [
                            food,
                            transport
                        ]
                    }]
                },

                options: {

                    responsive: true,

                    plugins: {
                        legend: {
                            position: "bottom"
                        }
                    }
                }
            });
        }


        // Show the chart when the page opens
        updateTracker();

    </script>

</body>
</html>
